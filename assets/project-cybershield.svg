<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">CYBERSHIELD</title>
  <desc id="desc">PASSWORD INTEGRITY &amp; LEAK ANALYZER</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0C10"/><stop offset="1" stop-color="#11101A"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#62D5FF"/></linearGradient>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .core{animation:core 3.8s ease-in-out infinite}
      .flow{stroke-dasharray:6 10;animation:flow 1.8s linear infinite}
      @keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="24" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".11"/>
  <rect x="8" y="8" width="1184" height="174" rx="18" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".07"/>
  <rect x="34" y="35" width="44" height="6" rx="3" fill="url(#accent)"/>
  <text x="34" y="87" fill="#F8F8F5" class="t" font-size="38" font-weight="750" letter-spacing="2">CYBERSHIELD</text>
  <text x="34" y="118" fill="#959BAA" class="t" font-size="13" font-weight="600" letter-spacing="1.5">PASSWORD INTEGRITY &amp; LEAK ANALYZER</text>
  <text x="34" y="151" fill="#8B5CF6" class="t" font-size="11" font-weight="650" letter-spacing="1.4">K-ANONYMITY  /  HIBP  /  ENTROPY  /  PYTHON</text>
  <g class="t" font-size="10" font-weight="700" letter-spacing="1.2">
    <rect x="800" y="44" width="340" height="102" rx="14" fill="#0E1018" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="824" y="78" fill="#8A91A2">SHA-1 PREFIX</text><text x="1116" y="78" fill="#62D5FF" text-anchor="end">5BAA6</text>
    <rect x="824" y="94" width="292" height="8" rx="4" fill="#FFFFFF" fill-opacity=".07"/><rect x="824" y="94" width="210" height="8" rx="4" fill="url(#accent)" class="core"/>
    <text x="824" y="128" fill="#8A91A2">SIZINTI KONTROLÜ</text><text x="1116" y="128" fill="#F25154" text-anchor="end">HASH SUNUCUYA GİTMEZ</text>
  </g>
</svg>
