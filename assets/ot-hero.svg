<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Enes Kavak — Siber güvenlik ve OT güvenliği</title>
  <desc id="desc">Zone ve conduit ağ diyagramı üzerinde hareket eden paketler ve tarama çizgisi</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080A"/><stop offset=".6" stop-color="#0C0D13"/><stop offset="1" stop-color="#090B10"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F25154"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#62D5FF"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62D5FF" stop-opacity="0"/><stop offset=".5" stop-color="#62D5FF" stop-opacity=".22"/><stop offset="1" stop-color="#62D5FF" stop-opacity="0"/></linearGradient>
    <radialGradient id="g1"><stop stop-color="#F25154" stop-opacity=".30"/><stop offset="1" stop-color="#F25154" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop stop-color="#62D5FF" stop-opacity=".20"/><stop offset="1" stop-color="#62D5FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFF" stroke-opacity=".03"/></pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.2" fill="#FFF" fill-opacity=".10"/></pattern>
    <clipPath id="card"><rect x="10" y="10" width="1180" height="380" rx="24"/></clipPath>
    <path id="c1" d="M862 118H958"/>
    <path id="c2" d="M1056 160V232"/>
    <path id="c3" d="M862 288H958"/>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .flow{stroke-dasharray:5 9;animation:flow 1.4s linear infinite}
      .flow2{stroke-dasharray:5 9;animation:flow 2s linear infinite reverse}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
      .sweep{animation:sweep 7s linear infinite}
      .blink{animation:blink 1.1s steps(2) infinite}
      .type{stroke-dasharray:420;stroke-dashoffset:420;animation:type 5s steps(36) .5s forwards}
      @keyframes flow{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
      @keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
      @keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(1260px)}}
      @keyframes blink{0%{opacity:1}100%{opacity:0}}
      @keyframes type{to{stroke-dashoffset:0}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="30" fill="#FFF" fill-opacity=".035" stroke="#FFF" stroke-opacity=".12"/>
  <rect x="10" y="10" width="1180" height="380" rx="24" fill="url(#bg)" stroke="#FFF" stroke-opacity=".08"/>
  <g clip-path="url(#card)">
    <rect x="10" y="10" width="1180" height="380" fill="url(#grid)"/>
    <rect x="10" y="10" width="1180" height="380" fill="url(#dots)"/>
    <circle cx="110" cy="370" r="230" fill="url(#g1)"/>
    <circle cx="1010" cy="40" r="250" fill="url(#g2)"/>
    <circle cx="640" cy="200" r="200" fill="url(#g3)"/>
    <rect class="sweep" x="0" y="10" width="200" height="380" fill="url(#scan)"/>
  </g>

  <!-- sol: metin -->
  <g class="t">
    <g transform="translate(64 52)">
      <rect width="196" height="28" rx="14" fill="#FFF" fill-opacity=".055" stroke="#FFF" stroke-opacity=".11"/>
      <circle cx="16" cy="14" r="4" fill="#F25154" class="pulse"/>
      <text x="30" y="18" fill="#BFC4D1" font-size="10" font-weight="650" letter-spacing="2">SECURITY NOTEBOOK</text>
    </g>
    <text x="64" y="172" fill="#F8F8F5" font-size="68" font-weight="800" letter-spacing="2">ENES</text>
    <text x="64" y="244" fill="#F8F8F5" font-size="68" font-weight="800" letter-spacing="2">KAVAK</text>
    <rect x="66" y="266" width="360" height="3" rx="1.5" fill="url(#line)"/>
    <text x="66" y="302" fill="#959BAA" font-size="14" font-weight="600" letter-spacing="3">CYBER SECURITY  ·  OT SECURITY</text>
  </g>
  <g class="m">
    <text x="66" y="350" fill="#62D5FF" font-size="13">$</text>
    <text x="84" y="350" fill="#8A91A2" font-size="13" letter-spacing=".5">map assets &#8594; segment zones &#8594; verify</text>
    <rect x="388" y="338" width="8" height="15" fill="#F25154" class="blink"/>
  </g>

  <!-- sağ: zone / conduit diyagramı -->
  <g class="m" font-size="10" letter-spacing="1.2">
    <g fill="none" stroke-width="2">
      <use href="#c1" stroke="#62D5FF" class="flow"/>
      <use href="#c2" stroke="#F25154" class="flow2"/>
      <use href="#c3" stroke="#8B5CF6" class="flow"/>
    </g>
    <circle r="4" fill="#62D5FF"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="4" fill="#F25154"><animateMotion dur="2s" repeatCount="indefinite" begin=".6s"><mpath href="#c2"/></animateMotion></circle>
    <circle r="4" fill="#8B5CF6"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1s"><mpath href="#c3"/></animateMotion></circle>

    <!-- IT -->
    <rect x="754" y="78" width="108" height="80" rx="14" fill="#10121A" stroke="#62D5FF" stroke-opacity=".75" stroke-dasharray="4 4"/>
    <text x="808" y="112" text-anchor="middle" fill="#62D5FF" font-weight="700" font-size="12">IT</text>
    <text x="808" y="132" text-anchor="middle" fill="#6E7585" font-size="9">ZONE A</text>
    <!-- DMZ -->
    <rect x="958" y="78" width="196" height="82" rx="14" fill="#10121A" stroke="#F25154" stroke-opacity=".8" stroke-dasharray="4 4"/>
    <text x="1056" y="112" text-anchor="middle" fill="#F25154" font-weight="700" font-size="12">DMZ</text>
    <text x="1056" y="132" text-anchor="middle" fill="#6E7585" font-size="9">ZONE B</text>
    <!-- MGMT -->
    <rect x="754" y="250" width="108" height="80" rx="14" fill="#10121A" stroke="#BFC4D1" stroke-opacity=".45" stroke-dasharray="4 4"/>
    <text x="808" y="284" text-anchor="middle" fill="#BFC4D1" font-weight="700" font-size="12">MGMT</text>
    <text x="808" y="304" text-anchor="middle" fill="#6E7585" font-size="9">ZONE D</text>
    <!-- OT -->
    <rect x="958" y="232" width="196" height="116" rx="14" fill="#10121A" stroke="#8B5CF6" stroke-opacity=".85" stroke-dasharray="4 4"/>
    <text x="1056" y="258" text-anchor="middle" fill="#8B5CF6" font-weight="700" font-size="12">OT · FIELD</text>
    <text x="1056" y="276" text-anchor="middle" fill="#6E7585" font-size="9">ZONE C</text>
    <g fill="#0A0B10" stroke="#8B5CF6" stroke-opacity=".9">
      <rect x="982" y="294" width="26" height="26" rx="6"/><rect x="1018" y="294" width="26" height="26" rx="6"/>
      <rect x="1054" y="294" width="26" height="26" rx="6"/><rect x="1090" y="294" width="26" height="26" rx="6" stroke="#F25154"/>
    </g>
    <circle cx="1103" cy="307" r="5" fill="#F25154" class="pulse"/>
    <circle cx="1103" cy="307" r="5" fill="none" stroke="#F25154" class="ring"/>

    <text x="910" y="110" text-anchor="middle" fill="#62D5FF" font-size="8">CONDUIT</text>
    <text x="910" y="280" text-anchor="middle" fill="#8B5CF6" font-size="8">CONDUIT</text>
    <text x="1074" y="202" fill="#F25154" font-size="8">CONDUIT</text>
  </g>
</svg>
