<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Enes Kavak — Siber güvenlik ve OT güvenliği</title>
  <desc id="desc">IEC 62443 zone ve conduit modelini gösteren hareketli profil kapağı</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090B"/><stop offset=".55" stop-color="#0D0E14"/><stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <radialGradient id="coralGlow"><stop offset="0" stop-color="#F25154" stop-opacity=".30"/><stop offset="1" stop-color="#F25154" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyanGlow"><stop offset="0" stop-color="#62D5FF" stop-opacity=".20"/><stop offset="1" stop-color="#62D5FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F25154"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#62D5FF"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,monospace}
      .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
      .flow-r{stroke-dasharray:6 10;animation:flow 2.2s linear infinite reverse}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
      .cursor{animation:cursor 1.3s steps(2) infinite}
      .shine{animation:shine 4.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.1);opacity:1}}
      @keyframes cursor{0%{opacity:1}100%{opacity:.1}}
      @keyframes shine{0%,100%{opacity:.7}50%{opacity:1}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="30" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/>
  <rect x="10" y="10" width="1180" height="360" rx="23" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".08"/>
  <rect x="10" y="10" width="1180" height="360" rx="23" fill="url(#grid)"/>
  <circle cx="120" cy="340" r="210" fill="url(#coralGlow)"/>
  <circle cx="1000" cy="60" r="240" fill="url(#cyanGlow)"/>

  <g class="t">
    <g transform="translate(64 50)">
      <rect width="262" height="28" rx="14" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/>
      <circle cx="16" cy="14" r="4" fill="#F25154" class="pulse"/>
      <text x="30" y="18" fill="#BFC4D1" font-size="10" font-weight="650" letter-spacing="2">DEFENSIVE SECURITY LAB</text>
    </g>
    <text x="64" y="170" fill="#F8F8F5" font-size="65" font-weight="750" letter-spacing="3">ENES KAVAK</text>
    <rect x="65" y="190" width="420" height="3" rx="1.5" fill="url(#line)"/>
    <text x="65" y="240" fill="url(#line)" font-size="20" font-weight="600" letter-spacing="2.6" class="shine">CYBER SECURITY · OT / ICS SECURITY</text>
    <text x="65" y="300" class="m" fill="#8A91A2" font-size="13" font-weight="500" letter-spacing="1">IEC 62443  /  ZONES &amp; CONDUITS  /  SL-T · SL-A  /  NETWORK DEFENSE</text>
  </g>

  <!-- Zone / conduit diyagramı -->
  <g class="m" font-size="10" letter-spacing="1.2">
    <!-- conduit hatları -->
    <path d="M868 124 H950" stroke="#62D5FF" stroke-width="2" fill="none" class="flow"/>
    <path d="M1046 156 V212" stroke="#F25154" stroke-width="2" fill="none" class="flow-r"/>
    <path d="M868 262 H950" stroke="#8B5CF6" stroke-width="2" fill="none" class="flow"/>

    <!-- Zone A: IT -->
    <rect x="770" y="84" width="98" height="80" rx="12" fill="#131620" stroke="#62D5FF" stroke-opacity=".7" stroke-dasharray="4 4"/>
    <text x="819" y="116" text-anchor="middle" fill="#62D5FF" font-weight="700">IT</text>
    <text x="819" y="134" text-anchor="middle" fill="#8A91A2" font-size="9">SL-T 2</text>

    <!-- Zone B: DMZ / SCADA -->
    <rect x="950" y="84" width="192" height="72" rx="12" fill="#131620" stroke="#F25154" stroke-opacity=".75" stroke-dasharray="4 4"/>
    <text x="1046" y="114" text-anchor="middle" fill="#F25154" font-weight="700">DMZ / SCADA</text>
    <text x="1046" y="132" text-anchor="middle" fill="#8A91A2" font-size="9">SL-T 3</text>

    <!-- Zone C: Saha -->
    <rect x="950" y="212" width="192" height="100" rx="12" fill="#131620" stroke="#8B5CF6" stroke-opacity=".8" stroke-dasharray="4 4"/>
    <text x="1046" y="236" text-anchor="middle" fill="#8B5CF6" font-weight="700">SAHA · PLC / CNC</text>
    <text x="1046" y="254" text-anchor="middle" fill="#8A91A2" font-size="9">SL-T 3 · SL-A 1</text>
    <circle cx="990" cy="286" r="7" fill="#08090B" stroke="#8B5CF6"/><circle cx="1020" cy="286" r="7" fill="#08090B" stroke="#8B5CF6"/>
    <circle cx="1050" cy="286" r="7" fill="#08090B" stroke="#8B5CF6"/><circle cx="1080" cy="286" r="7" fill="#08090B" stroke="#8B5CF6"/>
    <circle cx="1110" cy="286" r="7" fill="#08090B" stroke="#F25154" class="pulse"/>

    <!-- Zone D: Yönetim, soldan IT'ye değil; küçük kontrol noktası -->
    <rect x="770" y="226" width="98" height="72" rx="12" fill="#131620" stroke="#BFC4D1" stroke-opacity=".4" stroke-dasharray="4 4"/>
    <text x="819" y="258" text-anchor="middle" fill="#BFC4D1" font-weight="700">MGMT</text>
    <text x="819" y="276" text-anchor="middle" fill="#8A91A2" font-size="9">SL-T 2</text>

    <text x="909" y="116" text-anchor="middle" fill="#62D5FF" font-size="8">CONDUIT</text>
    <text x="909" y="254" text-anchor="middle" fill="#8B5CF6" font-size="8">CONDUIT</text>
  </g>
</svg>
