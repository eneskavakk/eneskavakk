<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">RSA LAB</title>
  <desc id="desc">CRYPTO FROM SCRATCH · INTERACTIVE</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0C10"/><stop offset="1" stop-color="#11101A"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#F25154"/><stop offset="1" stop-color="#62D5FF"/></linearGradient>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .core{animation:core 3.8s ease-in-out infinite}
      .flow{stroke-dasharray:6 10;animation:flow 1.8s linear infinite}
      @keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="24" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".11"/>
  <rect x="8" y="8" width="1184" height="174" rx="18" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".07"/>
  <rect x="34" y="35" width="44" height="6" rx="3" fill="url(#accent)"/>
  <text x="34" y="87" fill="#F8F8F5" class="t" font-size="38" font-weight="750" letter-spacing="2">RSA LAB</text>
  <text x="34" y="118" fill="#959BAA" class="t" font-size="13" font-weight="600" letter-spacing="1.5">CRYPTO FROM SCRATCH · INTERACTIVE</text>
  <text x="34" y="151" fill="#F25154" class="t" font-size="11" font-weight="650" letter-spacing="1.4">PURE PYTHON  /  MODULAR ARITHMETIC  /  STREAMLIT</text>
  <g class="t" font-size="11" font-weight="700" letter-spacing="1.2">
    <rect x="780" y="40" width="360" height="110" rx="14" fill="#0E1018" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="804" y="76" fill="#8A91A2">c = m<tspan baseline-shift="super" font-size="8">e</tspan> mod n</text>
    <text x="804" y="106" fill="#8A91A2">m = c<tspan baseline-shift="super" font-size="8">d</tspan> mod n</text>
    <text x="804" y="134" fill="#62D5FF" class="core">gcd(e, φ(n)) = 1</text>
  </g>
</svg>
