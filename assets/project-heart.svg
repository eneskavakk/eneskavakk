<svg xmlns="http://www.w3.org/2000/svg" width="580" height="190" viewBox="0 0 580 190" role="img" aria-labelledby="title desc">
  <title id="title">Kardiyak Risk İstasyonu</title>
  <desc id="desc">XGBoost ile klinik risk tahmini</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0C10"/><stop offset="1" stop-color="#14100F"/></linearGradient>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .beat{transform-origin:center;animation:beat 2.8s cubic-bezier(.32,.72,0,1) infinite}
      .dot{animation:dot 2.8s cubic-bezier(.32,.72,0,1) infinite}
      @keyframes beat{0%,100%{transform:scale(.98);opacity:.62}45%{transform:scale(1.03);opacity:1}}
      @keyframes dot{0%,100%{transform:translate3d(-16px,0,0);opacity:.2}50%{transform:translate3d(16px,0,0);opacity:1}}
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="188" rx="24" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".11"/>
  <rect x="8" y="8" width="564" height="174" rx="18" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".07"/>
  <text x="28" y="47" fill="#F25154" class="t" font-size="10" font-weight="700" letter-spacing="1.5">XGBOOST · FASTAPI</text>
  <text x="28" y="82" fill="#F8F8F5" class="t" font-size="24" font-weight="750">KARDİYAK RİSK</text>
  <text x="28" y="106" fill="#F8F8F5" class="t" font-size="24" font-weight="750">İSTASYONU</text>
  <text x="28" y="146" fill="#9299A8" class="t" font-size="11" font-weight="600" letter-spacing="1.1">MODEL → API → INTERFACE</text>
  <g class="beat">
    <path d="M326 104H356L366 86L378 129L393 61L407 111L418 91L430 104H548" fill="none" stroke="#F25154" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="442" cy="104" r="4" fill="#F25154" class="dot"/>
  </g>
</svg>
