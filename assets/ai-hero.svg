<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Enes Kavak — AI ve makine öğrenmesi</title>
  <desc id="desc">Hareketli yapay zekâ ağı ve uzmanlık başlıkları içeren profil kapağı</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090B"/>
      <stop offset=".55" stop-color="#0D0E14"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <radialGradient id="coralGlow">
      <stop offset="0" stop-color="#F25154" stop-opacity=".32"/>
      <stop offset="1" stop-color="#F25154" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F25154"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#62D5FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      .hero-text{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .float-a{animation:floatA 6s cubic-bezier(.32,.72,0,1) infinite}
      .float-b{animation:floatB 7.4s cubic-bezier(.32,.72,0,1) infinite}
      .pulse{transform-origin:center;animation:pulse 4.6s cubic-bezier(.32,.72,0,1) infinite}
      .cursor{animation:cursor 1.3s cubic-bezier(.32,.72,0,1) infinite}
      .shine{animation:shine 4.8s cubic-bezier(.32,.72,0,1) infinite}
      @keyframes floatA{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-11px,0)}}
      @keyframes floatB{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-10px,13px,0)}}
      @keyframes pulse{0%,100%{transform:scale(.92);opacity:.45}50%{transform:scale(1.08);opacity:1}}
      @keyframes cursor{0%,45%{opacity:1}55%,100%{opacity:.15}}
      @keyframes shine{0%,100%{opacity:.68;transform:translate3d(0,0,0)}50%{opacity:1;transform:translate3d(7px,0,0)}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="30" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/>
  <rect x="10" y="10" width="1180" height="340" rx="23" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".08"/>
  <rect x="10" y="10" width="1180" height="340" rx="23" fill="url(#grid)"/>
  <circle cx="132" cy="310" r="205" fill="url(#coralGlow)" class="float-b"/>
  <circle cx="1010" cy="58" r="235" fill="url(#violetGlow)" class="float-a"/>

  <g class="hero-text">
    <g transform="translate(64 48)">
      <rect width="222" height="28" rx="14" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/>
      <circle cx="16" cy="14" r="4" fill="#62D5FF" class="pulse"/>
      <text x="30" y="18" fill="#BFC4D1" font-size="10" font-weight="650" letter-spacing="2">INTELLIGENT SYSTEMS LAB</text>
    </g>

    <text x="64" y="161" fill="#F8F8F5" font-size="65" font-weight="750" letter-spacing="3">ENES KAVAK</text>
    <rect x="65" y="181" width="420" height="3" rx="1.5" fill="url(#line)"/>

    <text x="65" y="230" fill="url(#line)" font-size="20" font-weight="600" letter-spacing="2.6" class="shine">APPLIED AI · MACHINE LEARNING</text>

    <text x="65" y="291" fill="#8A91A2" font-size="13" font-weight="500" letter-spacing="1.4">PYTHON  /  XGBOOST  /  FASTAPI  /  EXPLAINABLE ML</text>
    <rect x="551" y="278" width="8" height="18" rx="2" fill="#F25154" class="cursor"/>
  </g>

  <g opacity=".78">
    <ellipse cx="972" cy="178" rx="144" ry="92" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>
    <ellipse cx="972" cy="178" rx="104" ry="142" fill="none" stroke="#FFFFFF" stroke-opacity=".07" transform="rotate(48 972 178)"/>
    <g>
      <circle cx="828" cy="178" r="6" fill="#F25154"/>
      <circle cx="1116" cy="178" r="5" fill="#62D5FF"/>
      <circle cx="972" cy="86" r="4" fill="#8B5CF6"/>
    </g>
    <g>
      <path d="M892 124L972 178L1056 118M972 178L1051 242M972 178L886 248" fill="none" stroke="#FFFFFF" stroke-opacity=".15"/>
      <circle cx="972" cy="178" r="38" fill="#11141C" stroke="url(#line)" stroke-width="1.5"/>
      <circle cx="972" cy="178" r="11" fill="#F8F8F5" class="pulse"/>
      <circle cx="892" cy="124" r="12" fill="#131620" stroke="#F25154"/>
      <circle cx="1056" cy="118" r="10" fill="#131620" stroke="#62D5FF"/>
      <circle cx="1051" cy="242" r="13" fill="#131620" stroke="#8B5CF6"/>
      <circle cx="886" cy="248" r="8" fill="#131620" stroke="#F25154"/>
    </g>
  </g>
</svg>
