<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">AIHR</title>
  <desc id="desc">Açıklanabilir aday eşleştirme platformu</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B0C10"/><stop offset="1" stop-color="#11101A"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#F25154"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .core{animation:core 3.8s cubic-bezier(.32,.72,0,1) infinite}
      @keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="24" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".11"/>
  <rect x="8" y="8" width="1184" height="174" rx="18" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".07"/>
  <rect x="34" y="35" width="44" height="6" rx="3" fill="url(#accent)"/>
  <text x="34" y="87" fill="#F8F8F5" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="40" font-weight="750" letter-spacing="2">AIHR</text>
  <text x="34" y="118" fill="#959BAA" class="t" font-size="13" font-weight="600" letter-spacing="1.5">EXPLAINABLE TALENT MATCHING</text>
  <text x="34" y="151" fill="#F25154" class="t" font-size="11" font-weight="650" letter-spacing="1.4">PYTHON  /  APPLIED AI  /  REPORTING</text>

  <g fill="none" stroke="#FFFFFF" stroke-opacity=".16">
    <path d="M766 54C850 54 867 95 930 95"/>
    <path d="M766 95H930"/>
    <path d="M766 136C850 136 867 95 930 95"/>
    <path d="M986 95C1045 95 1064 62 1138 62"/>
    <path d="M986 95C1045 95 1064 128 1138 128"/>
  </g>
  <g class="t" font-size="10" font-weight="650" letter-spacing="1">
    <rect x="690" y="40" width="82" height="28" rx="14" fill="#FFFFFF" fill-opacity=".06"/><text x="712" y="58" fill="#B8BECA">CV DATA</text>
    <rect x="690" y="81" width="82" height="28" rx="14" fill="#FFFFFF" fill-opacity=".06"/><text x="709" y="99" fill="#B8BECA">SKILLS</text>
    <rect x="690" y="122" width="82" height="28" rx="14" fill="#FFFFFF" fill-opacity=".06"/><text x="710" y="140" fill="#B8BECA">ROLE</text>
    <circle cx="958" cy="95" r="28" fill="#14121C" stroke="url(#accent)" class="core"/>
    <text x="946" y="99" fill="#F8F8F5">AI</text>
    <rect x="1130" y="48" width="44" height="28" rx="14" fill="#F25154" fill-opacity=".12"/><text x="1142" y="66" fill="#F25154">FIT</text>
    <rect x="1115" y="114" width="59" height="28" rx="14" fill="#8B5CF6" fill-opacity=".13"/><text x="1127" y="132" fill="#A983FF">REPORT</text>
