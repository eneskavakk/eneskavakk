<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">PORTATLAS</title>
  <desc id="desc">OT SECURITY &amp; CONNECTION REGISTRY</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0C10"/><stop offset="1" stop-color="#11101A"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#F25154"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <style>
      .t{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
      .core{animation:core 3.8s ease-in-out infinite}
      .flow{stroke-dasharray:6 10;animation:flow 1.8s linear infinite}
      @keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="24" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".11"/>
  <rect x="8" y="8" width="1184" height="174" rx="18" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".07"/>
  <rect x="34" y="35" width="44" height="6" rx="3" fill="url(#accent)"/>
  <text x="34" y="87" fill="#F8F8F5" class="t" font-size="38" font-weight="750" letter-spacing="2">PORTATLAS</text>
  <text x="34" y="118" fill="#959BAA" class="t" font-size="13" font-weight="600" letter-spacing="1.5">OT SECURITY &amp; CONNECTION REGISTRY</text>
  <text x="34" y="151" fill="#F25154" class="t" font-size="11" font-weight="650" letter-spacing="1.4">IEC 62443  /  ZONE · CONDUIT  /  SL-A · SL-T  /  FASTAPI</text>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".16" class="flow"><path d="M800 60H900M800 130H900M980 60H1060M980 130H1060M940 78V112"/></g>
  <g class="t" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <rect x="720" y="40" width="80" height="40" rx="10" fill="#131620" stroke="#62D5FF" stroke-dasharray="3 3"/><text x="760" y="64" fill="#62D5FF">IT</text>
    <rect x="900" y="40" width="80" height="40" rx="10" fill="#131620" stroke="#F25154" stroke-dasharray="3 3"/><text x="940" y="64" fill="#F25154">DMZ</text>
    <rect x="1060" y="40" width="80" height="40" rx="10" fill="#131620" stroke="#8B5CF6" stroke-dasharray="3 3"/><text x="1100" y="64" fill="#8B5CF6">SCADA</text>
    <rect x="900" y="112" width="240" height="40" rx="10" fill="#131620" stroke="#8B5CF6" stroke-dasharray="3 3"/><text x="1020" y="136" fill="#8B5CF6">SAHA · PLC / CNC</text>
    <rect x="720" y="112" width="80" height="40" rx="10" fill="#131620" stroke="#BFC4D1" stroke-opacity=".5" stroke-dasharray="3 3"/><text x="760" y="136" fill="#BFC4D1">MGMT</text>
